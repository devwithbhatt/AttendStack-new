# ==========================================================================
# coturn configuration for ZuperHR Live Monitoring
# File: /etc/turnserver.conf   (Debian/Ubuntu package: coturn)
# ==========================================================================
# This TURN/STUN server is only a FALLBACK relay for WebRTC: the screen
# stream goes peer-to-peer whenever possible and only flows through here when
# a restrictive office NAT/firewall blocks the direct path. It never touches
# the Django app server.
#
# Credentials use coturn's time-limited "use-auth-secret" (REST) scheme, which
# the backend mints in monitoring/ice.py from TURN_SHARED_SECRET — the
# static-auth-secret below MUST equal the backend's TURN_SHARED_SECRET.
# --------------------------------------------------------------------------

# --- Listening ---------------------------------------------------------------
listening-port=3478
tls-listening-port=5349

# The VPS public IP (single-homed). If the box is behind NAT, use:
#   external-ip=PUBLIC_IP/PRIVATE_IP
external-ip=93.127.206.42

# Realm — use your domain.
realm=zuperhr.in
server-name=zuperhr.in

# --- Authentication (REST / time-limited credentials) ------------------------
use-auth-secret
# >>> REPLACE with a strong secret, and set the SAME value as the backend's
# >>> TURN_SHARED_SECRET env var. Generate one with:  openssl rand -hex 32
static-auth-secret=REPLACE_WITH_openssl_rand_hex_32

# --- TLS (reuse the existing Let's Encrypt certificate) ----------------------
cert=/etc/letsencrypt/live/zuperhr.in/fullchain.pem
pkey=/etc/letsencrypt/live/zuperhr.in/privkey.pem
# coturn must be able to read these; see README for the group/permission note.

# --- Relay port range (open these in the firewall too) -----------------------
min-port=49152
max-port=65535

# --- Hardening ---------------------------------------------------------------
# No TURN relay to loopback/private ranges from the public internet.
no-loopback-peers
no-multicast-peers
# Disable the admin CLI (telnet) — not needed.
no-cli
# We only use long-term (REST) credentials; disable anonymous/other auth.
fingerprint
stale-nonce=600

# --- Logging -----------------------------------------------------------------
log-file=/var/log/turnserver/turn.log
simple-log
verbose
