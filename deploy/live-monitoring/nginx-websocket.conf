# ==========================================================================
# nginx: WebSocket routing for ZuperHR (chat + live monitoring)
# Add inside the  server { ... }  block for zuperhr.in
# (the HTTPS :443 server), ABOVE the catch-all  location / { ... }.
# ==========================================================================
#
# WHY THIS MATTERS: WebSocket requests (/ws/...) must go to the ASGI backend
# (Daphne on 127.0.0.1:8001), NOT to the Next.js frontend. The monitoring
# signalling sockets are:
#     /ws/monitor/agent/
#     /ws/monitor/view/<device_id>/
# and chat already uses /ws/chat/<id>/. One rule covers all of them.
#
# IMPORTANT: Verify whether a /ws/ location ALREADY exists on the live server
# (chat works in production, so it probably does). If it exists and points to
# 127.0.0.1:8001 with the Upgrade headers below, you do NOT need to add this —
# monitoring is already covered. Only add/modify if it's missing or wrong.
# --------------------------------------------------------------------------

location /ws/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;

    # WebSocket upgrade
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Standard forwarding headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long-lived sockets: don't cut the agent/viewer connection early.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
