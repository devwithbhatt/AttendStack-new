<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
<title>Authorization Required</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 24px;
    background: #f8f9fa;
    user-select: none;
    -webkit-app-region: no-drag;
  }
  h3 { margin: 0 0 8px; font-size: 15px; color: #333; }
  p { margin: 0 0 16px; font-size: 12px; color: #666; }
  input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
  }
  input:focus { outline: none; border-color: #0d6efd; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  button {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  .ok { background: #0d6efd; color: #fff; }
  .ok:hover { background: #0b5ed7; }
  .cancel { background: #e9ecef; color: #333; }
  .cancel:hover { background: #d3d7db; }
  .err {
    color: #dc3545;
    font-size: 12px;
    margin-top: 8px;
    display: none;
  }
</style>
</head>
<body>
  <h3>Admin Password Required</h3>
  <p>Enter the uninstall password to quit or uninstall this application.</p>
  <input type="password" id="pw" placeholder="Password" autofocus>
  <div class="err" id="err">Incorrect password. Try again.</div>
  <div class="btns">
    <button class="cancel" id="cancelBtn">Cancel</button>
    <button class="ok" id="verifyBtn">Verify</button>
  </div>
<script>
  document.getElementById("cancelBtn").onclick = () => {
    window.agentAPI.sendPasswordResult("");
  };
  document.getElementById("verifyBtn").onclick = () => {
    window.agentAPI.sendPasswordResult(document.getElementById("pw").value);
  };
  document.getElementById("pw").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      window.agentAPI.sendPasswordResult(document.getElementById("pw").value);
    }
  });
</script>
</body>
</html>
